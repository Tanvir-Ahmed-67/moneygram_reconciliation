spring.application.name=mgchecker
spring.datasource.url=jdbc:mysql://localhost:3306/moneygram_app?useSSL=false&sessionVariables=sql_mode='NO_ENGINE_SUBSTITUTION'&jdbcCompliantTruncation=false
spring.datasource.username=root
spring.datasource.password=
spring.jpa.properties.hibernate.dialect= org.hibernate.dialect.MySQL5InnoDBDialect

# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto= update
spring.thymeleaf.cache=false

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=30MB
server.port=8087

spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Increase pool size for parallel processing
spring.datasource.hikari.maximum-pool-size=30
# How long to wait for a connection before failing (in milliseconds)
spring.datasource.hikari.connection-timeout=30000
