spring.application.name=mgchecker
spring.datasource.url=jdbc:mysql://localhost:3306/frd_moneygram_app?useSSL=false&sessionVariables=sql_mode='NO_ENGINE_SUBSTITUTION'&jdbcCompliantTruncation=false
spring.datasource.username=root
spring.datasource.password=
spring.jpa.properties.hibernate.dialect= org.hibernate.dialect.MySQL5InnoDBDialect

# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto= update
spring.thymeleaf.cache=false

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=30MB
server.port=8086


# 1. Increase the pool size so the Housekeeper has a free slot
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.connection-timeout=60000

# 2. Enable real JDBC batching (crucial for 1M+ rows)
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true


# 3. Prevent the DB from timing out during the 'Magic Query'
spring.datasource.hikari.max-lifetime=1800000
