<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::content})}">
<head>
    <title>RECONSYSTEM | Dashboard</title>
</head>
<body>

<div th:fragment="content">
    <style>
        .status-dot { height: 8px; width: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
        .bg-processed { background-color: #10b981 !important; }
        .bg-staged { background-color: #f59e0b !important; }
        .bg-pending { background-color: #3b82f6 !important; }
        .date-pill { color: #64748b; font-weight: 600; font-size: 0.75rem; margin-bottom: 0.5rem; display: block; border-left: 3px solid #cbd5e1; padding-left: 8px; text-transform: uppercase; }
        .btn-action { font-size: 0.7rem; padding: 0.2rem 0.6rem; border-radius: 4px; font-weight: 500; white-space: nowrap; }
        .file-name-text { font-weight: 500; color: #1e293b; font-size: 0.8rem; }
        .table thead th { background-color: #f8fafc; text-transform: uppercase; font-size: 0.65rem; letter-spacing: 0.025em; color: #64748b; font-weight: 700; }
    </style>

    <header class="d-flex justify-content-between align-items-end mb-4">
        <div>
            <h1 style="font-size: 1.75rem; font-weight: 800; color: #0f172a;">Dashboard</h1>
            <p class="text-muted m-0">Monitoring variance for <strong>MoneyGram</strong></p>
        </div>
    </header>

    <div class="row g-3 mb-5">
        <div class="col-md-3">
            <div class="card border-0 shadow-sm p-4" style="border-top: 4px solid #ef4444 !important; border-radius: 12px;">
                <span class="text-uppercase text-muted fw-bold" style="font-size: 0.7rem;">Variance Gap</span>
                <div class="h3 fw-black my-2" style="font-weight: 800; color: #0f172a;">$8,240.50</div>
                <span class="small fw-bold" style="color: #ef4444;">● High Severity</span>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card border-0 shadow-sm p-4" style="border-top: 4px solid #10b981 !important; border-radius: 12px;">
                <span class="text-uppercase text-muted fw-bold" style="font-size: 0.7rem;">Success Rate</span>
                <div class="h3 fw-black my-2" style="font-weight: 800; color: #0f172a;">99.42%</div>
                <span class="small fw-bold" style="color: #10b981;">● Performing Well</span>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card border-0 shadow-sm p-4" style="border-top: 4px solid #2563eb !important; border-radius: 12px;">
                <span class="text-uppercase text-muted fw-bold" style="font-size: 0.7rem;">Exceptions</span>
                <div class="h3 fw-black my-2" style="font-weight: 800; color: #0f172a;">09</div>
                <span class="small fw-bold" style="color: #2563eb;">● Awaiting Action</span>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card border-0 shadow-sm p-4" style="border-top: 4px solid #0ea5e9 !important; border-radius: 12px;">
                <span class="text-uppercase text-muted fw-bold" style="font-size: 0.7rem;">Today's Total</span>
                <div class="h3 fw-black my-2" style="font-weight: 800; color: #0f172a;">1,402</div>
                <span class="small fw-bold" style="color: #0ea5e9;">● Active Transactions</span>
            </div>
        </div>
    </div>

    <div th:if="${message}" class="alert alert-success py-2 small" th:text="${message}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger py-2 small" th:text="${errorMessage}"></div>

</div>
</body>
</html>
