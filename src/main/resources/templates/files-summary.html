<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>File History | FRD</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #334155; font-size: 0.85rem; }
    .navbar { background-color: #0d2137 !important; padding: 0.5rem 2rem; }
    /* Compact Search Box in Navbar */
    .search-box {
      border-radius: 4px;
      border: 1px solid #cbd5e1;
      font-size: 0.8rem;
      width: 280px;
      transition: all 0.2s;
    }

    /* Subtle Status Indicators */
    .status-dot { height: 8px; width: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    .bg-processed { background-color: #10b981 !important; } /* Green */
    .bg-staged { background-color: #f59e0b !important; }   /* Orange/Yellow */
    .bg-pending { background-color: #3b82f6 !important; }    /* Blue */

    /* Clean Table Styling */
    .card { border: 1px solid #e2e8f0; border-radius: 0.5rem; box-shadow: none; margin-bottom: 1.5rem; }
    .table thead th {
      background-color: #f1f5f9;
      text-transform: uppercase;
      font-size: 0.7rem;
      letter-spacing: 0.025em;
      color: #64748b;
      font-weight: 600;
      border-bottom: 1px solid #e2e8f0;
    }
    .table tbody td { padding: 0.6rem 0.75rem; border-bottom: 1px solid #f1f5f9; color: #475569; }
    .file-name-text { font-weight: 500; color: #1e293b; }

    /* Grouping Headers */
    .date-pill {
      color: #64748b;
      font-weight: 600;
      font-size: 0.75rem;
      margin-bottom: 0.5rem;
      display: block;
      border-left: 3px solid #cbd5e1;
      padding-left: 8px;
    }

    .search-box { border-radius: 4px; border: 1px solid #cbd5e1; font-size: 0.8rem; }
    .btn-action { font-size: 0.7rem; padding: 0.2rem 0.6rem; border-radius: 4px; font-weight: 500; }

    /* Modal tweaks */
    .modal-content { border-radius: 0.5rem; }
    .modal-header { padding: 0.75rem 1rem; }
  </style>
</head>
<body>

<nav class="navbar navbar-dark shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">FRD <span class="fw-light">Reconciliation</span></a>
    <div class="d-flex align-items-center gap-3">
      <input type="text" id="fileSearch" class="form-control form-control-sm search-box" placeholder="Quick search date (e.g. 2024-05-20)...">
      <a th:href="@{/summary}" class="btn btn-outline-light btn-sm px-3">Summary View</a>
      <a th:href="@{/upload-file}" class="btn btn-outline-light btn-sm px-3">New Upload</a>
      <form th:action="@{/logout}" method="post" class="m-0">
        <button type="submit" class="btn btn-danger btn-sm px-3">Sign Out</button>
      </form>
    </div>
  </div>
</nav>

<div class="container-fluid px-4 py-4">
  <div class="row g-4">

    <div class="col-md-6">
      <p class="text-muted small fw-bold mb-3 text-uppercase">Payment File History</p>

      <div th:each="entry : ${paymentGroups}">
        <span class="date-pill" th:text="${#temporals.format(entry.key, 'dd MMM yyyy')}"></span>
        <div class="card">
          <table class="table table-sm align-middle mb-0">
            <thead>
            <tr>
              <th class="ps-3" style="width: 10%;">File Id</th>
              <th class="ps-3" style="width: 40%;">File Name</th>
              <th class="text-center" style="width: 10%;">Count</th>
              <th class="text-end" style="width: 20%;">Amount</th>
              <th class="text-center" style="width: 20%;">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="file : ${entry.value}" class="file-row">
              <td class="text-center" th:text="${file.id}"></td>
              <td class="ps-3">
                <span class="status-dot" th:classappend="${file.status.name() == 'PROCESSED' ? 'bg-processed' : (file.status.name() == 'STAGED' ? 'bg-staged' : 'bg-pending')}"></span>
                <span class="file-name-text" style="word-break: break-all;" th:text="${file.fileName}"></span>
              </td>
              <td class="text-center" th:text="${file.totalTransactions}"></td>
              <td class="text-end" th:text="${#numbers.formatDecimal(file.totalAmount, 1, 'COMMA', 2, 'POINT')}"></td>
              <td class="text-center">
                <a th:href="@{'/download-file/' + ${file.id}}" class="btn btn-outline-success btn-action">Download</a>
              </td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="col-md-6">
      <p class="text-muted small fw-bold mb-3 text-uppercase">Settlement File History</p>

      <div th:each="entry : ${settlementGroups}">
        <span class="date-pill" th:text="${#temporals.format(entry.key, 'dd MMM yyyy')}"></span>
        <div class="card">
          <table class="table table-sm align-middle mb-0">
            <thead>
            <tr>
              <th class="ps-3" style="width: 10%;">File Id</th>
              <th class="ps-3" style="width: 40%;">File Name</th>
              <th class="text-center" style="width: 10%;">Count</th>
              <th class="text-end" style="width: 20%;">Amount</th>
              <th class="text-center" style="width: 20%;">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="file : ${entry.value}" class="file-row">
              <td class="text-center" th:text="${file.id}"></td>
              <td class="ps-3">
                <span class="status-dot" th:classappend="${file.status.name() == 'PROCESSED' ? 'bg-processed' : (file.status.name() == 'STAGED' ? 'bg-staged' : 'bg-pending')}"></span>
                <span class="file-name-text" style="word-break: break-all;" th:text="${file.fileName}"></span>
              </td>
              <td class="text-center" th:text="${file.totalTransactions}"></td>
              <td class="text-end" th:text="${#numbers.formatDecimal(file.totalAmount, 1, 'COMMA', 2, 'POINT')}"></td>
              <td class="text-center">
                <a th:href="@{'/download-file/' + ${file.id}}" class="btn btn-outline-success btn-action">Download</a>
              </td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>
</div>

<div class="modal fade" id="viewModal" tabindex="-1">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-header bg-dark text-white border-0">
        <h6 class="modal-title">File Content Preview</h6>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-0">
        <table class="table table-sm table-hover mb-0">
          <thead class="sticky-top bg-white">
          <tr>
            <th class="ps-3">Transaction No</th>
            <th>Date</th>
            <th class="text-end">Amount</th>
            <th class="text-center">Status</th>
          </tr>
          </thead>
          <tbody id="modalTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Search Filter
  document.getElementById('fileSearch').addEventListener('keyup', function() {
    let val = this.value.toLowerCase();
    document.querySelectorAll('.file-row').forEach(row => {
      let name = row.querySelector('.file-name-text').textContent.toLowerCase();
      row.style.display = name.includes(val) ? "" : "none";
    });
  });
</script>
</body>
</html>
