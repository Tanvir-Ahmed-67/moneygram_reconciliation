<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RECONSOLVE | Control Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --sidebar-width: 240px;
            --primary-bg: #f8fafc;
            --navy-dark: #0f172a;
            --navy-hover: #1e293b;
            --accent-blue: #2563eb;
            --white: #ffffff;
            --border-color: #e2e8f0;
            --text-main: #334155;
            --text-muted: #64748b;
            --danger: #ef4444;
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--primary-bg);
            display: flex;
            color: var(--text-main);
            height: 100vh; /* Lock height */
            overflow: hidden; /* Prevent body scroll */
        }

        /* --- FIXED SIDEBAR --- */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--navy-dark);
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 24px 0;
            flex-shrink: 0;
        }

        .sidebar-brand {
            padding: 0 24px 32px;
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--white);
            letter-spacing: -0.5px;
        }
        .sidebar-brand span { color: var(--accent-blue); }

        .menu-label {
            padding: 0 24px 10px;
            font-size: 0.65rem;
            text-transform: uppercase;
            font-weight: 700;
            color: #475569;
            letter-spacing: 0.05em;
        }

        .menu-item {
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .menu-item:hover, .menu-item.active {
            background-color: var(--navy-hover);
            color: var(--white);
        }

        .menu-item.active { border-left: 4px solid var(--accent-blue); }

        /* --- DYNAMIC MAIN CONTENT --- */
        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto; /* Only content area scrolls */
            height: 100vh;
        }

        .top-bar {
            height: 64px;
            background: var(--white);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 0 40px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .content-area {
            padding: 32px 40px;
            max-width: 1600px; /* Limits width on ultra-wide screens */
        }

        /* --- COMMON UI COMPONENTS (To be used by your uploaded pages) --- */
        .page-header { margin-bottom: 24px; }
        .card { background: var(--white); border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .btn { padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.85rem; border: none; }
        .btn-primary { background: var(--accent-blue); color: white; }

    </style>
</head>
<body>
<aside class="sidebar">
    <div class="sidebar-brand">RECON<span>SOLVE</span></div>

    <p class="menu-label">Main Console</p>
    <a th:href="@{/files}" class="menu-item" th:classappend="${#httpServletRequest.requestURI == '/files' ? 'active' : ''}">
        <span class="menu-icon">🏠</span> Home Page
    </a>
    <a th:href="@{/upload-file}" class="menu-item" th:classappend="${#httpServletRequest.requestURI == '/upload-file' ? 'active' : ''}">
        <span class="menu-icon">📁</span> Upload & Stage
    </a>
    <a th:href="@{/result}" class="menu-item" th:classappend="${#httpServletRequest.requestURI == '/result' ? 'active' : ''}">
        <span class="menu-icon">🔎</span> Unreconciled
    </a>

    <p class="menu-label" style="margin-top:20px">Analytics</p>
    <a th:href="@{/summary}" class="menu-item" th:classappend="${#httpServletRequest.requestURI == '/summary' ? 'active' : ''}">
        <span class="menu-icon">📈</span> Recon Summary
    </a>

    <div style="margin-top: auto;">
        <form th:action="@{/logout}" method="post" id="logoutForm" style="display:none;"></form>
        <a href="javascript:void(0)" onclick="document.getElementById('logoutForm').submit();" class="menu-item" style="color: #fca5a5;">
            <span class="menu-icon">🚪</span> Sign Out
        </a>
    </div>
</aside>
<div class="main-wrapper">
    <header class="top-bar">
        <div style="font-size: 0.8rem; font-weight: 600; color: var(--text-muted);">
            User: System Admin | <span style="color: var(--accent-blue);">House #44029</span>
        </div>
    </header>

    <main class="content-area" id="dashboard-content">

        <div class="page-header">
            <h1 style="font-size: 1.75rem; font-weight: 800;">Welcome Back</h1>
            <p style="color: var(--text-muted);">System is currently synced and healthy.</p>
        </div>

        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px;">
            <div class="card" style="padding: 20px;">
                <div style="font-size: 0.7rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">Status</div>
                <div style="font-size: 1.5rem; font-weight: 800; margin-top: 5px;">Ready</div>
            </div>
        </div>

    </main>
</div>
<script>
    document.addEventListener("submit", function(e) {
        const action = e.target.action ? e.target.action.toLowerCase() : "";
        if (action.includes('upload') || action.includes('process-files')) {
            const loader = document.getElementById("loaderOverlay");
            if(loader) loader.style.display = "flex";
        }
    });
</script>
</body>
</html>
