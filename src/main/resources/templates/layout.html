<!DOCTYPE html>
<html th:fragment="layout(content)" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>RECONSYSTEM | DASHBOARD</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --sidebar-width: 260px;
      --navy-dark: #0f172a;
      --navy-hover: #1e293b;
      --primary-bg: #f8fafc;
      --transition-speed: 0.3s;
    }

    body { font-family: 'Inter', sans-serif; background-color: var(--primary-bg); margin: 0; display: flex; height: 100vh; overflow: hidden; }

    /* --- SIDEBAR --- */
    .sidebar {
      width: var(--sidebar-width);
      background-color: var(--navy-dark);
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 24px 0;
      flex-shrink: 0;
      transition: margin-left var(--transition-speed) ease-in-out;
      z-index: 1050;
    }

    /* COLLAPSED STATE */
    body.sidebar-collapsed .sidebar {
      margin-left: calc(var(--sidebar-width) * -1);
    }

    .sidebar-brand { padding: 0 24px 32px; color: white; font-weight: 800; font-size: 1.4rem; letter-spacing: -0.5px; }
    .menu-label { padding: 0 24px 8px; font-size: 0.65rem; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 1px; }
    .menu-item { padding: 12px 24px; color: #94a3b8; text-decoration: none; font-size: 0.85rem; font-weight: 500; display: flex; align-items: center; gap: 12px; transition: all 0.2s; }
    .menu-item:hover { background-color: var(--navy-hover); color: white; }
    .menu-item.active { background-color: #1e293b; color: white; border-right: 4px solid #3b82f6; }

    /* --- MAIN WRAPPER --- */
    .main-wrapper {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100%;
      transition: width var(--transition-speed) ease-in-out;
    }

    .top-bar {
      height: 60px;
      background: white;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      padding: 0 24px;
      justify-content: space-between;
    }

    .toggle-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      color: var(--navy-dark);
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
    }

    .content-area { padding: 32px; overflow-y: auto; flex-grow: 1; }

    /* --- LOADER --- */
    #loaderOverlay {
      display:none; position:fixed; top:0; left:0; width:100%; height:100%;
      background:rgba(255,255,255,0.8); z-index:9999; align-items:center; justify-content:center;
      backdrop-filter: blur(4px); flex-direction: column;
    }
  </style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-brand">RECON<span style="color: #3b82f6;">SOLVE</span></div>

  <p class="menu-label">Operations</p>
  <a th:href="@{/files}" class="menu-item" th:classappend="${#httpServletRequest.requestURI == '/files' ? 'active' : ''}">
    <i class="bi bi-house-door"></i> Home Page
  </a>
  <a th:href="@{/upload-file}" class="menu-item" th:classappend="${#httpServletRequest.requestURI == '/upload-file' ? 'active' : ''}">
    <i class="bi bi-cloud-arrow-up"></i> Upload & Stage
  </a>
  <a th:href="@{/result}" class="menu-item" th:classappend="${#httpServletRequest.requestURI == '/result' ? 'active' : ''}">
    <i class="bi bi-exclamation-octagon"></i> Unreconciled
  </a>

  <p class="menu-label" style="margin-top:20px">Analytics</p>
  <a th:href="@{/summary}" class="menu-item" th:classappend="${#httpServletRequest.requestURI == '/summary' ? 'active' : ''}">
    <i class="bi bi-graph-up-arrow"></i> Date Wise Summary
  </a>

  <div style="margin-top: auto;">
    <form th:action="@{/logout}" method="post" id="logoutForm">
      <a href="javascript:void(0)" onclick="document.getElementById('logoutForm').submit();" class="menu-item" style="color: #fca5a5;">
        <i class="bi bi-box-arrow-left"></i> Sign Out
      </a>
    </form>
  </div>
</aside>

<div class="main-wrapper">
  <header class="top-bar">
    <div class="d-flex align-items-center gap-3">
      <button class="toggle-btn" id="sidebarToggle">
        <i class="bi bi-list"></i>
      </button>
      <span style="font-size: 0.8rem; font-weight: 600; color: #64748b;">System Active | Branch #44029</span>
    </div>
    <div id="top-search-placeholder">
    </div>
  </header>

  <main class="content-area">
    <div th:replace="${content}"></div>
  </main>
</div>

<div id="loaderOverlay">
  <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
  <h5 class="mt-3 fw-bold">Processing...</h5>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const sidebarToggle = document.getElementById('sidebarToggle');
  const body = document.body;

  // Toggle Sidebar
  sidebarToggle.addEventListener('click', () => {
    body.classList.toggle('sidebar-collapsed');

    // Optional: Save preference to localStorage
    const isCollapsed = body.classList.contains('sidebar-collapsed');
    localStorage.setItem('sidebarStatus', isCollapsed ? 'collapsed' : 'expanded');
  });

  // Load preference on page load
  window.addEventListener('DOMContentLoaded', () => {
    const status = localStorage.getItem('sidebarStatus');
    if (status === 'collapsed') {
      body.classList.add('sidebar-collapsed');
    }
  });
</script>

</body>
</html>
