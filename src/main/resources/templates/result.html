<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unreconciled Data | FRD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f7f9; color: #334155; }
        .navbar { background-color: #0d2137 !important; padding: 0.75rem 2rem; }
        .navbar-brand { font-weight: 700; letter-spacing: -0.5px; }
        .page-title { color: #0d2137; font-weight: 700; margin-bottom: 0.25rem; }

        /* Card & Table */
        .card { border: none; border-radius: 1rem; box-shadow: 0 4px 20px rgba(0,0,0,0.04); overflow: hidden; }
        .table { margin-bottom: 0; }
        .table thead th {
            background-color: #f8fafc;
            text-transform: uppercase;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: #64748b;
            border-top: none;
            padding: 1rem;
        }
        .table tbody td { padding: 1rem; border-color: #f1f5f9; font-size: 0.9rem; }
        .table-hover tbody tr:hover { background-color: #fdfdfd; }

        /* Custom Badges */
        .badge-custom { padding: 0.4em 0.8em; border-radius: 6px; font-weight: 600; font-size: 0.75rem; }
        .source-payment { background-color: #e0e7ff; color: #4338ca; }
        .source-settlement { background-color: #fef3c7; color: #92400e; }

        .amount-val { font-family: 'Inter', sans-serif; font-weight: 700; color: #0f172a; }
        .btn-export { font-weight: 600; border-radius: 0.75rem; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold brand-text" href="#">Foreign Remittance Division <span class="fw-light">Reconciliation System</span></a>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button type="submit" class="btn btn-outline-light btn-sm rounded-pill px-3 fw-medium">Logout</button>
        </form>
    </div>
</nav>

<div class="container-fluid px-lg-5 py-4">
    <!-- Page Title & Buttons -->
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-2 gap-3">
        <div>
            <h3 class="page-title">Unreconciled Records</h3>
            <p class="text-muted small mb-0">
                Discrepancy report based on the latest automated matching.<br/>
                <strong>Data up to: </strong><span th:text="${upToDate}">N/A</span>
            </p>
        </div>
        <div class="d-flex gap-2">
            <button id="exportExcel" class="btn btn-success btn-sm btn-export px-3">Download Excel</button>
            <a th:href="@{/}" class="btn btn-outline-secondary btn-sm btn-export px-3">New Upload</a>
        </div>
    </div>

    <!-- Search Box -->
    <div class="d-flex align-items-center justify-content-end mb-3">
        <div style="width: 250px;">
            <input type="text" id="tableSearch" class="form-control form-control-sm" placeholder="Search transactions...">
        </div>
    </div>

    <!-- Unreconciled Table -->
    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table id="allTable" class="table table-hover align-middle">
                <thead>
                <tr>
                    <th>Serial</th>
                    <th>Legacy ID</th>
                    <th>Txn. No</th>
                    <th>Txn. Date</th>
                    <th>Org. Country</th>
                    <th>Source</th>
                    <th>Ref. No</th>
                    <th class="text-end pe-4">Amount</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="txn, stat : ${allData}">
                    <td th:text="${stat.index + 1}"></td>
                    <td th:text="${txn.legacyId}"></td>
                    <td th:text="${txn.transactionNo}"></td>
                    <td th:text="${txn.transactionDate}"></td>
                    <td th:text="${txn.originatingCountry}"></td>
                    <td>
                        <span th:text="${txn.sourceType}"
                              th:classappend="${txn.sourceType.name() == 'PAYMENT' ? 'source-payment' : 'source-settlement'}"
                              class="badge-custom"></span>
                    </td>
                    <td th:text="${txn.referenceNo}"></td>
                    <td class="text-end" th:text="${#numbers.formatDecimal(txn.amount,1,'COMMA',2,'POINT')}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(allData)}">
                    <td colspan="8" class="text-center py-5 text-muted">
                        <div class="py-3">
                            <p class="mb-0">All clear! No unreconciled records found.</p>
                        </div>
                    </td>
                </tr>
                </tbody>
                <tfoot class="table-light">
                <tr class="fw-bold">
                    <td colspan="7" class="text-end">Total :</td>
                    <td class="text-end pe-4" th:text="${#numbers.formatDecimal(allTotal,1,'COMMA',2,'POINT')}"></td>
                </tr>
                </tfoot>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>
    // --- Excel Export ---
    function exportTableToExcel(tableId, filename = 'export.xlsx') {
        const table = document.getElementById(tableId);
        const wb = XLSX.utils.table_to_book(table, { sheet: "Unreconciled" });
        XLSX.writeFile(wb, filename);
    }

    document.getElementById('exportExcel').addEventListener('click', function() {
        exportTableToExcel('allTable', 'unreconciled.xlsx');
    });

    // --- Search Logic ---
    document.getElementById('tableSearch').addEventListener('keyup', function() {
        const filter = this.value.toLowerCase();
        const rows = Array.from(document.querySelectorAll('#allTable tbody tr'));
        rows.forEach(row => {
            const match = row.textContent.toLowerCase().includes(filter);
            row.style.display = match ? '' : 'none';
        });
    });
</script>

</body>
</html>
