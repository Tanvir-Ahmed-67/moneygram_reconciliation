<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Login | ReconSystem</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
<div class="container">
  <div class="row justify-content-center">
    <div class="col-12 col-md-5 col-lg-4">
      <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body p-4 p-md-5">
          <div class="text-center mb-4">
            <h2 class="fw-bold text-secondary">Recon System</h2>
            <p class="text-muted small">Please sign in to continue</p>
          </div>

          <div th:if="${param.logout}" class="alert alert-info border-0 small text-center">
            You have been logged out.
          </div>

          <div th:if="${param.error}" class="alert alert-danger border-0 small text-center">
            Invalid username or password.
          </div>

          <form th:action="@{/login}" method="POST">
            <div class="mb-3">
              <label class="form-label fw-semibold text-muted">Username</label>
              <input type="text" name="username" class="form-control form-control-lg shadow-none" required autofocus />
            </div>
            <div class="mb-4">
              <label class="form-label fw-semibold text-muted">Password</label>
              <input type="password" name="password" class="form-control form-control-lg shadow-none" required />
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-dark btn-lg rounded-pill shadow-sm">Login</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
