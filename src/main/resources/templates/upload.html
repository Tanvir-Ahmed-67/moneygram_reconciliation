<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Reconciliation System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; height: 100vh; overflow: hidden; }
        .navbar { background-color: #0d2137 !important; }
        .card { border: none; border-radius: 1rem; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }

        /* Compact Multi-Select List */
        .file-list-box {
            background: white;
            border: 1.5px solid #e9ecef;
            border-radius: 0.5rem;
            height: 100px; /* Fixed height to prevent scrolling the whole page */
            overflow-y: auto;
            padding: 5px;
        }
        .file-item { font-size: 0.8rem; padding: 2px 8px; display: flex; align-items: center; }
        .file-item input { margin-right: 8px; }

        .form-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px; color: #6c757d; font-weight: 700; margin-bottom: 0.25rem; }
        .btn { border-radius: 0.5rem; font-weight: 600; font-size: 0.85rem; padding: 0.5rem; }
        .btn-primary { background-color: #0d2137; border: none; width: 100%; }
        .btn-success { background-color: #198754; border: none; padding: 0.8rem 3rem; font-size: 1rem; }
        .btn-danger-sm { font-size: 0.7rem; padding: 2px 8px; border-radius: 4px; }

        .staged-container { background-color: #f1f3f5; border-radius: 0.75rem; padding: 1rem; }

        #loaderOverlay {
            display:none; position:fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(255,255,255,0.85); z-index:9999; align-items:center; justify-content:center;
            backdrop-filter: blur(2px);
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark shadow-sm px-4">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">Foreign Remittance <span class="fw-light">Reconciliation</span></a>
        <form th:action="@{/logout}" method="post" class="mb-0"><button type="submit" class="btn btn-sm btn-outline-light rounded-pill px-4 py-1">Logout</button></form>
    </div>
</nav>

<div class="container mt-3">
    <div class="row justify-content-center">
        <div class="col-lg-11 col-xl-10">

            <div th:if="${message}" class="alert alert-info border-0 text-center small py-1 mb-2 shadow-sm" role="alert">
                <span th:text="${message}"></span>
            </div>

            <div class="card p-3">
                <div class="row g-3">

                    <div class="col-md-6">
                        <div class="staged-container">
                            <form th:action="@{/delete-files}" method="post">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <h6 class="fw-bold m-0" style="color: #0d2137;">Staged Files</h6>
                                    <button type="submit" class="btn btn-outline-danger btn-danger-sm">Delete Selected</button>
                                </div>

                                <label class="form-label">Payment Files</label>
                                <div class="file-list-box mb-2">
                                    <div th:each="file : ${stagedPaymentFiles}" class="file-item">
                                        <input type="checkbox" name="fileIds" th:value="${file.id}">
                                        <span th:text="${file.fileName}"></span>
                                    </div>
                                    <div th:if="${#lists.isEmpty(stagedPaymentFiles)}" class="text-muted small p-2">Empty</div>
                                </div>

                                <label class="form-label">Settlement Files</label>
                                <div class="file-list-box">
                                    <div th:each="file : ${stagedSettlementFiles}" class="file-item">
                                        <input type="checkbox" name="fileIds" th:value="${file.id}">
                                        <span th:text="${file.fileName}"></span>
                                    </div>
                                    <div th:if="${#lists.isEmpty(stagedSettlementFiles)}" class="text-muted small p-2">Empty</div>
                                </div>
                            </form>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <h6 class="fw-bold mb-3" style="color: #0d2137;">Upload New Data</h6>
                        <form id="uploadForm" method="POST" enctype="multipart/form-data" th:action="@{/upload}">
                            <div class="mb-2">
                                <label for="payment_file" class="form-label">Payment File</label>
                                <input type="file" class="form-control" id="payment_file" name="payment_file" multiple />
                            </div>
                            <div class="mb-3">
                                <label for="settlement_file" class="form-label">Settlement File</label>
                                <input type="file" class="form-control" id="settlement_file" name="settlement_file" multiple />
                            </div>
                            <button type="submit" class="btn btn-primary shadow-sm mb-2">Upload & Stage Files</button>
                            <a th:href="@{/result}" class="btn btn-outline-dark w-100" style="font-size: 0.8rem;">View Last Report</a>
                        </form>
                    </div>
                </div>

                <div class="text-center pt-3 mt-2 border-top">
                    <form id="processForm" th:action="@{/process-files}" method="post">
                        <button type="submit" class="btn btn-success shadow-lg">Process Reconciliation</button>
                    </form>
                </div>

            </div>
        </div>
    </div>
</div>

<div id="loaderOverlay">
    <div class="text-center">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-3 fw-bold">Processing...</p>
    </div>
</div>

<script>
    document.querySelectorAll('form').forEach(form => {
        form.addEventListener("submit", function() {
            if (!this.action.includes('logout') && !this.action.includes('delete')) {
                document.getElementById("loaderOverlay").style.display = "flex";
            }
        });
    });
</script>
</body>
</html>
