<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Files</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-6 col-lg-5">

      <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body p-4 p-md-5">

          <div class="text-center mb-4">
            <h2 class="fw-bold text-secondary">Upload Files</h2>
            <p class="text-muted small">Select your documents to proceed</p>
          </div>

          <form method="POST" enctype="multipart/form-data" th:action="@{/upload}">

            <div class="mb-3">
              <label for="payment_file" class="form-label fw-semibold text-muted">Payment File</label>
              <input type="file" class="form-control form-control-lg shadow-none" id="payment_file" name="payment_file" required />
            </div>

            <div class="mb-4">
              <label for="settlement_file" class="form-label fw-semibold text-muted">Settlement File</label>
              <input type="file" class="form-control form-control-lg shadow-none" id="settlement_file" name="settlement_file" required />
            </div>

            <div class="d-grid">
              <button type="submit" class="btn btn-dark btn-lg rounded-pill shadow-sm">
                Confirm & Upload
              </button>
            </div>
          </form>

          <div th:if="${message}" class="mt-4">
            <div class="alert alert-secondary border-0 text-center small mb-0" role="alert">
              <span th:text="${message}"></span>
            </div>
          </div>

        </div>
      </div>

      <div class="text-center mt-3">
        <small class="text-muted">Maximum file size: 10MB</small>
      </div>
</body>
