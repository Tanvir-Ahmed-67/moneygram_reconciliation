<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload | MoneyGram Reconciliation System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; }
    .navbar { background-color: #0d2137 !important; }
    .card { border: none; border-radius: 1.25rem; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
    .brand-text { letter-spacing: -0.5px; }
    .form-label { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; color: #6c757d; }
    .form-control { border-radius: 0.75rem; padding: 0.75rem; border: 1.5px solid #e9ecef; }
    .form-control:focus { border-color: #0d2137; box-shadow: 0 0 0 4px rgba(13,33,55,0.1); }
    .btn-primary { background-color: #0d2137; border: none; border-radius: 0.75rem; padding: 0.8rem; font-weight: 600; }
    .btn-outline-custom { color: #0d2137; border: 1.5px solid #0d2137; border-radius: 0.75rem; font-weight: 600; }
    .btn-outline-custom:hover { background-color: #0d2137; color: white; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark shadow-sm px-4">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold brand-text" href="#">MoneyGram <span class="fw-light">Reconciliation System</span></a>
    <form th:action="@{/logout}" method="post">
      <button type="submit" class="btn btn-sm btn-outline-light rounded-pill px-4">Logout</button>
    </form>
  </div>
</nav>

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-6 col-lg-5">
      <div class="card">
        <div class="card-body p-4 p-md-5">
          <div class="text-center mb-4">
            <h3 class="fw-bold" style="color: #0d2137;">Data Import</h3>
            <p class="text-muted small">Upload both of your files to begin reconciliation</p>
          </div>

          <form id="uploadForm" method="POST" enctype="multipart/form-data" th:action="@{/upload}">
            <div class="mb-3">
              <label for="payment_file" class="form-label fw-bold">Payment File</label>
              <input type="file" class="form-control" id="payment_file" name="payment_file" required />
            </div>

            <div class="mb-4">
              <label for="settlement_file" class="form-label fw-bold">Settlement File</label>
              <input type="file" class="form-control" id="settlement_file" name="settlement_file" required />
            </div>

            <div class="d-grid gap-3">
              <button type="submit" class="btn btn-primary shadow-sm">Confirm & Upload</button>
              <a th:href="@{/result}" class="btn btn-outline-custom">View Last Report</a>
            </div>
          </form>

          <div th:if="${message}" class="mt-4">
            <div class="alert alert-info border-0 text-center small py-3" role="alert">
              <span th:text="${message}"></span>
            </div>
          </div>
        </div>
      </div>
      <div class="text-center mt-3">
        <small class="text-muted">Maximum file size: <strong>10MB</strong></small>
      </div>
    </div>
  </div>
</div>
<!-- Loader Overlay -->
<div id="loaderOverlay"
     style="display:none;
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:rgba(255,255,255,0.8);
            z-index:9999;
            align-items:center;
            justify-content:center;">

  <div class="text-center">
    <div class="spinner-border text-primary" role="status"
         style="width:3rem;height:3rem;">
    </div>
    <p class="mt-3 fw-bold">Processing files... Please wait</p>
  </div>
</div>
<script>
  document.getElementById("uploadForm")
          .addEventListener("submit", function () {

            // Show loader
            const loader = document.getElementById("loaderOverlay");
            loader.style.display = "flex";
          });
</script>
</body>
</html>
